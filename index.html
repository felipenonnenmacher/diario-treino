<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<meta name="description" content="Diário de treino de academia: fichas, treino do dia, calendário, medidas e evolução.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diário de Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; routines colored like Olympic bumper plates */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#141a26; --muted:#5b6475; --line:#dbe0e8;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --good:#15803d; --good-soft:#e2f3e8; --danger:#b91c1c; --danger-soft:#fbe5e5;
  --p-red:#d42a2a; --p-blue:#1d4ed8; --p-yellow:#d99e00; --p-green:#1f8a4c; --p-black:#2b2f36;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.06);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#161a23; --surface-2:#1c212c; --ink:#e7ebf2; --muted:#98a1b2; --line:#2a303d;
  --accent:#6d97ff; --accent-ink:#0b1020; --accent-soft:#1d2945;
  --good:#4ac27a; --good-soft:#15291e; --danger:#f07171; --danger-soft:#341a1c;
  --p-red:#ef4b4b; --p-blue:#5b8cff; --p-yellow:#f2bb2c; --p-green:#3fb46f; --p-black:#c9d0dc;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#161a23; --surface-2:#1c212c; --ink:#e7ebf2; --muted:#98a1b2; --line:#2a303d;
  --accent:#6d97ff; --accent-ink:#0b1020; --accent-soft:#1d2945;
  --good:#4ac27a; --good-soft:#15291e; --danger:#f07171; --danger-soft:#341a1c;
  --p-red:#ef4b4b; --p-blue:#5b8cff; --p-yellow:#f2bb2c; --p-green:#3fb46f; --p-black:#c9d0dc;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.is-live .app{padding-block-end:calc(170px + env(safe-area-inset-bottom,0px))}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;border-radius:2px;background:var(--p-red);box-shadow:5px 0 0 var(--p-blue),10px 0 0 var(--p-yellow)}
.brand span{margin-left:12px}
.top .date{color:var(--muted);font-size:13px}

.view{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sec{font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.block{width:100%}
.btn.big{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;min-height:52px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* Today hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--plate,var(--line))}
.hero h1{font-size:38px;line-height:1;text-transform:uppercase}
.hero .meta{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.ex{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.wd b{font-family:var(--f-display);font-size:18px;font-weight:600}
.wd small{font-size:11px;color:var(--muted);font-weight:600}
.wd .dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px dashed var(--line)}
.wd .dot.plan{border-color:var(--muted)}
.wd .dot.done{border:none;background:var(--plate)}
.wd.today{border-color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.plate{width:30px;height:30px;border-radius:50%;background:var(--plate);flex:none;position:relative}
.plate::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
.ritem .t{font-weight:600}
.ritem .s{font-size:13px;color:var(--muted)}

/* Routine cards */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rhead{flex-wrap:wrap}.rhead .grow{min-width:55%}
.rhead h3{font-size:22px;text-transform:uppercase;overflow-wrap:anywhere}
.days{display:flex;gap:3px}
.days span{width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:600;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.days span.on{background:var(--plate);color:var(--surface)}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.exrow:last-of-type{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);flex:none;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb.vthumb,.lthumb.vthumb{background-color:#555;background-repeat:no-repeat}
.libitem .pic.v{background-color:#555;background-repeat:no-repeat}
.vbadge{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:10px;display:grid;place-items:center}
.media.vmedia video{width:100%;max-height:60vh;aspect-ratio:4/5;object-fit:contain;background:#3a3a3a;display:block}
.thumb.lib{width:64px;height:48px;background-color:#fff;background-repeat:no-repeat;background-size:auto 100%;background-position:-4px center}
.libanim{width:100%;aspect-ratio:320/213;background-color:#fff;background-repeat:no-repeat;background-size:200% 100%;background-position:0 0}
@media (prefers-reduced-motion:no-preference){.libanim{animation:flip 2.2s infinite}@keyframes flip{0%,49.9%{background-position:0 0}50%,100%{background-position:100% 0}}}
.libcap{font-size:12px;color:var(--muted);padding:6px 10px;background:var(--surface)}
.groups{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.groups button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.groups button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.libitem{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.libitem .pic{position:relative;width:100%;aspect-ratio:1/1;background-color:#fff;background-repeat:no-repeat;background-size:200% auto;background-position:0 50%}
.libitem span{padding:7px 9px;font-size:13px;font-weight:600;line-height:1.25}
.libitem em{font-style:normal;font-size:11px;color:var(--good);display:block;font-weight:600}
.thumb .play{position:absolute;inset:auto 4px 4px auto;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.exrow .t{font-weight:600}
.exrow .s{font-size:13px;color:var(--muted)}
.rfoot{display:flex;gap:8px;padding:10px 14px;background:var(--surface-2);border-top:1px solid var(--line)}

/* Live workout */
.livebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.livebar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--plate)}
.livebar h1{font-size:26px;text-transform:uppercase;line-height:1}
.clock{font-family:var(--f-display);font-size:30px;font-weight:600}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.excard.complete{border-color:var(--good)}
.lhead{display:flex;flex-direction:column;gap:6px}
.lclock{text-align:center;font-family:var(--f-display);font-size:30px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.ltitle{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ltitle h1{font-size:36px;line-height:1.05;text-transform:none;min-width:0}
.ltitle .btn{flex:none;font-size:16px;color:var(--muted)}
.llist{display:flex;flex-direction:column;gap:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.lcard.done{border-color:var(--good)}
.ltop{display:flex;align-items:center;gap:6px;padding:14px 12px 14px 14px}
.lchk{flex:none;width:34px;height:34px;border-radius:9px;border:2px solid var(--muted);background:transparent;color:transparent;display:grid;place-items:center;padding:0}
.lcard.done .lchk{background:var(--good);border-color:var(--good);color:var(--surface)}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0 0 0 6px;text-align:left}
.lthumb{--t:96px;flex:none;width:var(--t);height:var(--t);border-radius:14px;background:#fff;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;font-weight:700;color:#5b6475}
.lthumb.lib{background-repeat:no-repeat;background-size:auto 100%;background-position:calc(var(--t) * -0.25) center}
.lthumb img,.lthumb video{width:100%;height:100%;object-fit:cover}
.ltxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ltxt b{font-size:21px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.ltxt span{font-size:17px;color:var(--muted)}
.lcard.done .ltxt b{text-decoration:line-through;text-decoration-color:var(--good)}
.chev{flex:none;color:var(--muted)}
.lrest{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:16px 20px;text-align:left;font-size:17px}
.lrest .num{font-size:22px;font-family:var(--f-display);font-weight:500}
.finishbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.finishbar .btn{max-width:528px;margin:0 auto;display:flex;border-radius:16px;text-transform:none;font-size:22px}
@media (max-width:380px){.lthumb{--t:80px}.ltxt b{font-size:18px}.ltitle h1{font-size:30px}}
.livepic{display:block;width:100%;padding:0;border:0;background:none;border-radius:12px;overflow:hidden}
.livepic .media{border-radius:12px}
.livename{font-size:24px;text-transform:uppercase;line-height:1.05}
.meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mfield{display:flex;flex-direction:column;gap:4px;min-width:0}
.mfield span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.mfield input{width:100%;min-width:0;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:600;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.excard.complete .mfield input{background:var(--good-soft);border-color:transparent}
.excard .hd{display:flex;gap:12px;align-items:center}
.excard .hd .t{font-weight:600;font-size:16px}
.excard .last{font-size:13px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:6px;align-items:center}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.sets .n{font-family:var(--f-display);font-weight:600;font-size:18px;text-align:center;color:var(--muted)}
.sets input{width:100%;min-width:0;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:600;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.check{height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.setrow-done input{background:var(--good-soft);border-color:transparent}

.restpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(142px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.restpill b{font-family:var(--f-display);font-size:22px;min-width:56px}
.restpill button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:99px;padding:6px 10px;font-weight:600;font-size:13px}
.restpill.over{background:var(--good);color:var(--surface)}

/* Calendar */
.calnav{display:flex;align-items:center;justify-content:space-between}
.calnav h2{font-size:24px;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:2px}
.cell{aspect-ratio:1;max-width:100%;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-size:17px;font-weight:600;padding:0}
.cell.out{visibility:hidden}
.cell.done{background:var(--plate);border-color:var(--plate);color:var(--surface)}
.cell.today{outline:2px solid var(--ink);outline-offset:-2px}
.cell.future{color:var(--muted)}
.cell .mini{display:flex;gap:2px}
.cell .mini i{width:5px;height:5px;border-radius:50%;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--plate)}
.slist .ritem{cursor:pointer}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unit{position:relative}
.unit input{padding-right:34px}
.unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.daypick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.platepick{display:flex;gap:10px;flex-wrap:wrap}
.platepick button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background:var(--plate);padding:0;position:relative}
.platepick button.on{border-color:var(--ink)}
.platepick button::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}

/* Table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
.d{font-size:11px;display:block}
.d.up{color:var(--good)} .d.down{color:var(--danger)}

/* Segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chart{width:100%;height:auto;display:block}
.evocard{display:flex;flex-direction:column;gap:10px}
.mchart{position:relative;touch-action:pan-y}
.tip{position:absolute;top:4px;z-index:2;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;max-width:220px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.tip strong{font-size:12px}
.tip div{display:flex;align-items:center;gap:6px}
.tip i,.elegend i{width:10px;height:10px;border-radius:3px;flex:none}
.tip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tip em,.elegend em{font-style:normal;font-size:12px;color:var(--muted)}
.elegend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.elegend li{display:flex;align-items:center;gap:8px;font-size:14px}
.elegend b{font-weight:600}
.elegend em{min-width:58px;text-align:right}
.elegend em.up{color:var(--good)}.elegend em.down{color:var(--danger)}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.prlist .ritem{cursor:default}
.pr{font-family:var(--f-display);font-size:22px;font-weight:700}

/* Empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:19px;text-transform:uppercase}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-size:24px;text-transform:uppercase}
.media{width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.media img,.media video{width:100%;max-height:50vh;object-fit:contain;display:block;background:#000}
.mediaempty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.detail-set{display:flex;flex-wrap:wrap;gap:6px}
.detail-set span{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--good-soft);color:var(--good);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:440px){.top .date{display:none}.brand{font-size:20px}}
@media (max-width:380px){.hero h1{font-size:32px}.stat b{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}

/* acesso */
body.is-auth .app{padding-block-end:32px}
body.is-auth .top{display:none}
.authcard{max-width:420px;width:100%;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.authcard h1{font-size:30px;text-transform:uppercase;letter-spacing:.03em}
.authcard p{margin:0}
.authlogo i{display:inline-block;width:12px;height:30px;border-radius:3px;background:var(--p-red);box-shadow:7px 0 0 var(--p-blue),14px 0 0 var(--p-yellow)}
.authmsg{margin:0;padding:10px 12px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:14px}
.authmsg.ok{background:var(--good-soft);color:var(--good)}
.acct{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:15px;padding:0;display:grid;place-items:center}
.acct em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--danger-soft);color:var(--danger)}
.urow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.urow .grow{min-width:180px}
.uact{display:flex;gap:6px;flex-wrap:wrap}
/* IA */
.aibadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);flex:none}
.aibanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--accent);background:var(--accent-soft)}
.aibanner b{font-size:16px}.aibanner span.muted{font-size:13px}
.aicard{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aicard h3{font-size:19px;text-transform:uppercase}
.ainote{margin:0;font-size:12px;color:var(--muted)}
.md{font-size:15px;line-height:1.55;max-width:65ch}
.md h4{font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin:12px 0 4px}
.md h4:first-child{margin-top:0}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:20px}.md li{margin:3px 0}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chipsel button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ailoading{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 10px}
.ailoading p{margin:0}
.spin{display:inline-block;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;vertical-align:middle}
.spin.sm{width:14px;height:14px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.aitips{margin:6px 0 0;padding-left:20px}.aitips li{margin:3px 0}
</style>

/* ---------- HOJE ---------- */
function viewHoje(){
  if(S.live)return viewLive();
  const now=new Date(),dow=now.getDay(),t=today();
  const todays=S.routines.filter(r=>(r.days||[]).includes(dow));
  const doneToday=S.sessions.filter(s=>s.date===t);
  const main=todays.find(r=>!doneToday.some(s=>s.routineId===r.id))||todays[0];
  let hero;
  if(S.mode==="loading"){hero=`<section class="hero"><div class="eyebrow">Carregando</div><h1>Seu treino</h1><p class="meta">Buscando suas fichas…</p></section>`}
  else if(!S.routines.length){hero=`<section class="hero"><div class="eyebrow">Comece aqui</div><h1>Monte sua ficha</h1><p class="meta">Cadastre seus treinos da semana com séries, cargas e a foto ou vídeo de cada movimento.</p><button class="btn primary big" data-act="aiRoutine">${SPARK} Criar rotina com IA</button><button class="btn" data-act="newRoutine">Montar minha ficha manualmente</button></section>`}
  else if(main){
    const done=doneToday.some(s=>s.routineId===main.id);
    const groups=[...new Set((main.exercises||[]).map(e=>e.group).filter(Boolean))];
    hero=`<section class="hero" style="--plate:${plateVar(main.color)}">
      <div class="eyebrow">Treino de hoje · ${DIASL[dow]}</div>
      <h1>${esc(main.name)}</h1>
      <div class="chips">${groups.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}${main.exemplo?'<span class="chip ex">Exemplo</span>':""}</div>
      <p class="meta">${(main.exercises||[]).length} exercícios${done?" · <b>já feito hoje</b>":""}</p>
      <button class="btn ${done?"":"primary"} big" data-act="start" data-id="${main.id}">${done?"Treinar de novo":"Começar treino"}</button>
    </section>`;
  } else {
    hero=`<section class="hero"><div class="eyebrow">${DIASL[dow]}</div><h1>Dia de descanso</h1><p class="meta">Nenhuma ficha marcada para hoje. Se quiser treinar mesmo assim, escolha uma abaixo.</p></section>`;
  }
  // week strip
  const ws=weekStart(now);let week="";
  for(let i=0;i<7;i++){const dd=new Date(ws);dd.setDate(ws.getDate()+i);const k=ymd(dd);
    const s=S.sessions.find(x=>x.date===k);const plan=S.routines.some(r=>(r.days||[]).includes(i));
    week+=`<div class="wd ${k===t?"today":""}"><small>${DIAS[i]}</small><b class="num">${dd.getDate()}</b><span class="dot ${s?"done":plan?"plan":""}" style="${s?`--plate:${plateVar(s.color)}`:""}"></span></div>`}
  const wkCount=S.sessions.filter(s=>pYmd(s.date)>=ws).length;
  const planned=new Set(S.routines.flatMap(r=>r.days||[])).size;
  const mStart=ymd(new Date(now.getFullYear(),now.getMonth(),1));
  const mCount=S.sessions.filter(s=>s.date>=mStart).length;
  const others=S.routines.filter(r=>r!==main);
  const last=S.sessions[0];
  return`${hero}
  <div class="week">${week}</div>
  <div class="stats">
    <div class="stat"><b class="num">${wkCount}${planned?`<span class="muted" style="font-size:18px">/${planned}</span>`:""}</b><span>esta semana</span></div>
    <div class="stat"><b class="num">${streakWeeks()}</b><span>semanas seguidas</span></div>
    <div class="stat"><b class="num">${mCount}</b><span>em ${MESES[now.getMonth()]}</span></div>
  </div>
  ${others.length?`<h2 class="sec">Outras fichas</h2><div class="rlist">${others.map(r=>`<button class="ritem" data-act="start" data-id="${r.id}" style="--plate:${plateVar(r.color)}"><span class="plate"></span><span class="grow"><span class="t">${esc(r.name)}</span><br><span class="s">${daysText(r.days)} · ${(r.exercises||[]).length} exercícios</span></span><span class="muted">Iniciar ›</span></button>`).join("")}</div>`:""}
  ${last?`<h2 class="sec">Último treino <small>${relDate(last.date)}</small></h2>${sessionItem(last)}`:""}`;
}
function daysText(days){days=(days||[]).slice().sort();return days.length?days.map(d=>DIASL[d].slice(0,3)).join(", "):"Sem dia fixo"}
function relDate(s){const diff=Math.round((pYmd(today())-pYmd(s))/864e5);if(diff===0)return"hoje";if(diff===1)return"ontem";if(diff<7)return`há ${diff} dias`;const d=pYmd(s);return`${d.getDate()}/${pad(d.getMonth()+1)}`}

    entries:r.exercises.map(ex=>{

      const lw=ls.length?Math.max(...ls.map(x=>num(x.w)||0)):null;
      return{exId:ex.id,name:ex.name,libId:ex.libId||null,mediaId:ex.mediaId||null,mediaType:ex.mediaType||null,rest:parseInt(ex.rest)||90,
        n:String(parseInt(ex.sets)||3),r:String(ex.reps||""),w:lw!=null?String(lw).replace(".",","):(ex.load!=null&&ex.load!==""?String(ex.load).replace(".",","):""),done:false};

function normLive(L){ if(L&&L.entries)L.entries.forEach(e=>{ if(e.sets&&e.n==null){const d=e.sets.filter(x=>x.done);const f=e.sets[0]||{};e.n=String(e.sets.length);e.r=String(f.r??"");e.w=String(f.w??"");e.done=e.sets.length>0&&d.length===e.sets.length;delete e.sets} }); return L }

  const left=Math.round((S.rest.end-Date.now())/1000);const over=left<=0;const a=Math.abs(left);
  if(!r.firstElementChild)r.innerHTML=`<div class="restpill" role="timer"><span></span><b class="num"></b><button data-act="restAdd" data-s="-15">−15</button><button data-act="restAdd" data-s="15">+15</button><button data-act="restStop">Ok</button></div>`;

async function finishWorkout(){
  const L=S.live;
  const entries=L.entries.filter(e=>e.done).map(e=>({exId:e.exId,name:e.name,sets:Array.from({length:Math.max(1,parseInt(e.n)||1)},()=>({w:num(e.w)??0,r:parseInt(e.r)||0,done:true}))}));
  if(!entries.length){toast("Conclua pelo menos um exercício.");return}
  // records
  const prs=[];
  entries.forEach(e=>{const prev=S.sessions.filter(s=>s.date<=L.date).flatMap(s=>(s.entries||[]).filter(x=>x.exId===e.exId).flatMap(doneSets));
    const mx=Math.max(...e.sets.map(s=>s.w));const pm=prev.length?Math.max(...prev.map(s=>num(s.w)||0)):null;
    if(pm!=null&&mx>pm)prs.push(`${e.name} ${fmt(mx)} kg`)});
  const id=uid();
  const doc={date:L.date,routineId:L.routineId,routineName:L.routineName,color:L.color,startedAt:new Date(L.start).toISOString(),durationMin:Math.max(1,Math.round((Date.now()-L.start)/60000)),entries};
  const ok=await dbWrite(()=>db.collection("sessions").doc(id).set(doc));
  if(!ok)return;
  S.live=null;S.rest=null;saveLive();try{wakeLock&&wakeLock.release()}catch(e){}
  render();window.scrollTo(0,0);
  const vol=volumeOf(doc);toast(prs.length?`Treino salvo. Novo recorde: ${prs.join(", ")}`:vol>0?`Treino salvo · ${fmt(vol,0)} kg de volume`:"Treino salvo");
}

/* ---------- EVOLUÇÃO ---------- */
function lineChart(pts,unit){
  if(pts.length<2)return`<div class="empty"><b>Poucos dados</b><span>${pts.length?"Mais um registro e o gráfico aparece.":"Registre pelo menos dois para ver a linha de evolução."}</span></div>`;
  const W=340,H=190,pl=40,pr=14,pt=14,pb=28,ys=pts.map(p=>p.y);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}const g=(hi-lo)*.15;lo-=g;hi+=g;
  const X=i=>pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let grid="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=Y(v);grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area=`${line}L${X(pts.length-1).toFixed(1)},${H-pb}L${pl},${H-pb}Z`;
  const lbl=i=>{const d=pYmd(pts[i].x);return`${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
  const idxs=[...new Set([0,Math.floor((pts.length-1)/2),pts.length-1])];
  const xl=idxs.map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${lbl(i)}</text>`).join("");
  const dots=pts.length<=24?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="2.5" fill="var(--accent)"/>`).join(""):"";
  const L=pts.length-1;
  return`<div class="card" style="padding:10px 6px"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unit}">
    ${grid}<path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <circle cx="${X(L)}" cy="${Y(pts[L].y)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${xl}</svg></div>`;
}
function viewEvo(){return aiCard()+viewEvoInner()}
function viewEvoInner(){
  const seg=`<div class="seg"><button class="${S.evoMode==="ex"?"on":""}" data-act="evoMode" data-m="ex">Cargas</button><button class="${S.evoMode==="me"?"on":""}" data-act="evoMode" data-m="me">Medidas</button></div>`;
  if(S.evoMode==="me"){
    const m=MEDIDAS.find(x=>x.k===S.evoMeasure)||MEDIDAS[0];
    const pts=S.measures.filter(r=>num(r[m.k])!=null).map(r=>({x:r.date,y:num(r[m.k])})).reverse();
    const first=pts[0],last=pts[pts.length-1];
    return`${seg}<div class="field"><label for="evo-m">Medida</label><select id="evo-m" data-sel="evoMeasure">${MEDIDAS.map(x=>`<option value="${x.k}" ${x.k===m.k?"selected":""}>${x.n} (${x.u})</option>`).join("")}</select></div>
    ${pts.length?`<div class="stats"><div class="stat"><b class="num">${fmt(last.y)}</b><span>atual · ${m.u}</span></div><div class="stat"><b class="num">${fmt(first.y)}</b><span>início · ${m.u}</span></div><div class="stat"><b class="num">${last.y-first.y>0?"+":""}${fmt(last.y-first.y)}</b><span>variação</span></div></div>`:""}
    ${lineChart(pts,m.u)}`;
  }
  const exs=allExercises();
  const withHist=exs.filter(e=>exHistory(e.id).length);
  if(!withHist.length)return`${seg}<div class="empty"><b>Nada para mostrar ainda</b><span>Finalize treinos na aba Hoje. Cada ficha ganha um gráfico com a carga de todos os exercícios ao longo das datas.</span></div>`;
  const unitSeg=`<div class="seg"><button class="${S.evoUnit!=="pct"?"on":""}" data-act="evoUnit" data-u="kg">Peso (kg)</button><button class="${S.evoUnit==="pct"?"on":""}" data-act="evoUnit" data-u="pct">% de evolução</button></div>`;
  // group sessions by routine
  const groups=new Map();
  [...S.sessions].reverse().forEach(ss=>{const k=ss.routineId||ss.routineName;if(!groups.has(k))groups.set(k,{id:k,name:(routineById(ss.routineId)||{}).name||ss.routineName||"Treino",color:ss.color,sessions:[]});groups.get(k).sessions.push(ss)});
  window.EVO={};
  const cards=[...groups.values()].map((g,gi)=>{
    const r=routineById(g.id);
    const order=[...(r?.exercises||[]).map(e=>e.id)];
    g.sessions.forEach(ss=>(ss.entries||[]).forEach(e=>{if(!order.includes(e.exId))order.push(e.exId)}));
    const dates=[...new Set(g.sessions.map(ss=>ss.date))].sort();
    const series=order.map((id,ix)=>{
      const vals=dates.map(d=>{const ws=g.sessions.filter(ss=>ss.date===d).flatMap(ss=>(ss.entries||[]).filter(e=>e.exId===id).flatMap(doneSets)).map(x=>num(x.w)||0);return ws.length?Math.max(...ws):null});
      const name=(r?.exercises||[]).find(e=>e.id===id)?.name||g.sessions.flatMap(ss=>ss.entries||[]).find(e=>e.exId===id)?.name||"Exercício";
      return{id,name,slot:ix,vals};
    }).filter(se=>se.vals.some(v=>v!=null)&&se.slot<8);
    const cid="evo"+gi;
    const body=dates.length<2?`<div class="empty"><span>Registrado em 1 dia até agora. A partir do segundo dia de treino, as linhas aparecem aqui.</span></div>`:multiChart(cid,dates,series);
    const legend=series.map(se=>{const v=se.vals.filter(x=>x!=null);const f=v[0],l=v[v.length-1];const d=l-f;
      return`<li><i style="background:var(--s${se.slot+1})"></i><span class="grow">${esc(se.name)}</span><b class="num">${fmt(l)} kg</b><em class="num ${d>0?"up":d<0?"down":""}">${v.length>1?(d>0?"+":"")+fmt(d)+" kg":"–"}</em></li>`}).join("");
    return`<section class="card evocard" style="--plate:${plateVar(g.color)}"><div class="row"><span class="plate" style="width:22px;height:22px"></span><h3 class="grow" style="font-size:20px;text-transform:uppercase">${esc(g.name)}</h3><span class="muted" style="font-size:13px">${g.sessions.length} treino${g.sessions.length>1?"s":""}</span></div>${body}<ul class="elegend">${legend}</ul></section>`;
  }).join("");
  const prs=withHist.map(e=>{const hh=exHistory(e.id);const b=hh.reduce((a,c)=>c.max>a.max?c:a);return{name:e.name,max:b.max,date:b.date}}).sort((a,b)=>b.date<a.date?-1:1).slice(0,8);
  return`${seg}${unitSeg}<p class="muted" style="margin:-6px 0 0;font-size:13px">${S.evoUnit==="pct"?"Quanto cada carga subiu em relação ao primeiro treino registrado (0% = carga inicial).":"Carga máxima usada em cada exercício, por data de treino."} Toque no gráfico para ver os valores do dia.</p>
  ${cards}
  ${prs.length?`<h2 class="sec">Recordes pessoais</h2><div class="rlist prlist">${prs.map(p=>`<div class="ritem"><span class="grow"><span class="t">${esc(p.name)}</span><br><span class="s">${relDate(p.date)}</span></span><span class="pr num">${fmt(p.max)} kg</span></div>`).join("")}</div>`:""}`;
}
function multiChart(cid,dates,series){
  const pct=S.evoUnit==="pct";
  const ser=series.map(se=>{const f=se.vals.find(v=>v!=null);return{...se,y:se.vals.map(v=>v==null?null:pct?(f?(v/f-1)*100:0):v)}});
  const all=ser.flatMap(se=>se.y.filter(v=>v!=null));
  let lo=Math.min(...all),hi=Math.max(...all);if(pct){lo=Math.min(lo,0);hi=Math.max(hi,0)}else lo=Math.min(lo,0);
  if(lo===hi){hi=lo+(pct?10:10)}
  // nice ticks
  const step=(()=>{const raw=(hi-lo)/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p})();
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const W=340,H=200,pl=40,pr=12,pt=12,pb=26;
  const t=dates.map(d=>pYmd(d).getTime()),t0=t[0],t1=t[t.length-1];
  const X=i=>pl+(t1===t0?0:(t[i]-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let grid="";for(let v=lo;v<=hi+1e-9;v+=step){const y=Y(v);grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${Math.abs(v)<1e-9&&pct?1.5:1}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v,step<1?1:0)}${pct?"%":""}</text>`}
  const lbl=i=>{const d=pYmd(dates[i]);return`${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
  const idxs=[...new Set([0,Math.floor((dates.length-1)/2),dates.length-1])];
  const xl=idxs.map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?"start":i===dates.length-1?"end":"middle"}">${lbl(i)}</text>`).join("");
  const lines=ser.map(se=>{let d="",pen=false;se.y.forEach((v,i)=>{if(v==null)return;d+=`${pen?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;pen=true});
    const dots=se.y.map((v,i)=>v==null?"":`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="var(--s${se.slot+1})" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
    return`<path d="${d}" fill="none" stroke="var(--s${se.slot+1})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`}).join("");
  window.EVO[cid]={dates,xs:dates.map((_,i)=>X(i)),W,pt,pb,H,ser:ser.map(se=>({name:se.name,slot:se.slot,vals:se.vals,y:se.y})),pct};
  return`<div class="mchart" data-chart="${cid}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução das cargas por exercício">${grid}${lines}${xl}<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/></svg><div class="tip" hidden></div></div>`;
}
function chartHover(el,clientX){
  const c=window.EVO&&window.EVO[el.dataset.chart];if(!c)return;
  const svg=el.querySelector("svg"),r=svg.getBoundingClientRect();const x=(clientX-r.left)*c.W/r.width;
  let bi=0,bd=1e9;c.xs.forEach((v,i)=>{const d=Math.abs(v-x);if(d<bd){bd=d;bi=i}});
  const xh=svg.querySelector(".xh");xh.setAttribute("x1",c.xs[bi]);xh.setAttribute("x2",c.xs[bi]);xh.setAttribute("visibility","visible");
  const d=pYmd(c.dates[bi]);const tip=el.querySelector(".tip");
  const rows=c.ser.filter(se=>se.vals[bi]!=null).map(se=>`<div><i style="background:var(--s${se.slot+1})"></i><span>${esc(se.name)}</span><b class="num">${fmt(se.vals[bi])} kg${c.pct?` <em>${se.y[bi]>0?"+":""}${fmt(se.y[bi],0)}%</em>`:""}</b></div>`).join("");
  tip.innerHTML=`<strong>${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}</strong>${rows||'<div><span class="muted">Sem registro</span></div>'}`;tip.hidden=false;
  const px=c.xs[bi]/c.W*r.width;const tw=tip.offsetWidth;let left=px+12;if(left+tw>r.width)left=px-tw-12;tip.style.left=Math.max(0,left)+"px";
}
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest(".mchart");if(el)chartHover(el,e.clientX)});

function makeDb(){
  const base=()=>["users",UID];
  const wrapDoc=r=>({id:r.id,set:d=>FS.setDoc(r,d),update:d=>FS.updateDoc(r,d),delete:()=>FS.deleteDoc(r),get:()=>FS.getDoc(r),onSnapshot:(n,e)=>FS.onSnapshot(r,n,e)});
  const wrapQ=q=>({orderBy:(f,d)=>wrapQ(FS.query(q,FS.orderBy(f,d||"asc"))),limit:n=>wrapQ(FS.query(q,FS.limit(n))),onSnapshot:(n,e)=>FS.onSnapshot(q,n,e),get:()=>FS.getDocs(q)});
  return{
    collection(p){const c=FS.collection(fsdb,...base(),...p.split("/"));return Object.assign(wrapQ(c),{doc:id=>wrapDoc(id?FS.doc(c,id):FS.doc(c))})},
    doc(p){return wrapDoc(FS.doc(fsdb,...base(),...p.split("/")))}
  };
}
async function compressImage(file,max=900,q=0.72){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let d=c.toDataURL("image/jpeg",q);if(d.length>900000)d=c.toDataURL("image/jpeg",0.5);return d;
  }finally{URL.revokeObjectURL(url)}
}
const assetsImpl={

    if(!file.type.startsWith("image/"))throw{code:"unsupported_type"};
    const data=await compressImage(file);if(data.length>950000)throw{code:"too_large"};
    const id=uid();await withTimeout(FS.setDoc(FS.doc(fsdb,"users",UID,"media",id),{data,at:Date.now()}));

async function gErr(r){let msg="";try{const j=await r.json();msg=(j.error&&j.error.message)||""}catch(e){}
  const code=r.status===429?"rate_limited":(r.status===400&&/api key/i.test(msg))||r.status===401||r.status===403?"bad_key":r.status===404?"bad_model":"upstream";return{code,message:msg}}
const partsText=j=>((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
async function gemini(prompt,{json=false,onText,signal,cfg}={}){
  cfg=cfg||S.aiCfg;if(!cfg||!cfg.key)throw{code:"no_key"};
  const model=encodeURIComponent(cfg.model||GEMINI_DEFAULT_MODEL);
  const body=JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:json?{responseMimeType:"application/json"}:{}});
  const headers={"Content-Type":"application/json","x-goog-api-key":cfg.key};
  const baseUrl="https://generativelanguage.googleapis.com/v1beta/models/"+model;
  let r;
  try{r=await fetch(baseUrl+(onText?":streamGenerateContent?alt=sse":":generateContent"),{method:"POST",headers,body,signal})}
  catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"network"}}
  if(!r.ok)throw await gErr(r);
  let text="";
  if(onText){
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    try{for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(line.startsWith("data:")){try{const t=partsText(JSON.parse(line.slice(5)));if(t){text+=t;onText({text})}}catch(e){}}}}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled",text};throw{code:"network",text}}
  }else{const j=await r.json();text=partsText(j);if(!text)throw{code:j.promptFeedback&&j.promptFeedback.blockReason?"refused":"empty"}}
  if(!text)throw{code:"empty"};
  if(json){try{return JSON.parse(text)}catch(e){const m=text.match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(e2){}}throw{code:"invalid_json"}}}
  return{text};
}

function md(t){

  let out="",list=false;const close=()=>{if(list){out+="</ul>";list=false}};
  String(t||"").split(/\r?\n/).forEach(raw=>{const l=raw.trim();let m;
    if(!l){close();return}

    const allow=S.aiForm.dsel.length?S.aiForm.dsel:null;const dias=[...new Set((Array.isArray(f.dias)?f.dias:[]).map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6&&!used.has(d)&&(!allow||allow.includes(d))))];dias.forEach(d=>used.add(d));
    const exercicios=(Array.isArray(f.exercicios)?f.exercicios:[]).map(e=>{const L=libById(String(e.id||""));if(!L)return null;
      const series=Math.min(10,Math.max(1,parseInt(e.series)||3));const rest=Math.min(300,Math.max(0,parseInt(e.descanso)||60));
      return{lib:L,series,reps:String(e.reps||"10").slice(0,20),rest,obs:String(e.obs||"").slice(0,140)}}).filter(Boolean);
    return{nome:String(f.nome||"Treino").slice(0,60),dias:dias.sort(),exercicios};
  }).filter(f=>f.exercicios.length);
  if(!fichas.length)throw{code:"invalid_json"};
  return{resumo:String(res.resumo||""),fichas,dicas:(Array.isArray(res.dicas)?res.dicas:[]).map(String).slice(0,5)};
}
async function aiGenerate(){
  const c=sheetCtx;if(!c||c.kind!=="ai")return;
  const o=$("#ai-obs");if(o)S.aiForm.obs=o.value;LS.set("treino-aiform",S.aiForm);
  c.ctl=new AbortController();c.step="loading";
  aiSheetSet(`<h2>Criar rotina com IA</h2><div class="ailoading"><span class="spin" aria-hidden="true"></span><p>O Gemini está montando sua rotina…<br><span class="muted">Pode levar até um minuto.</span></p></div><button class="btn block" data-act="aiCancel">Cancelar</button>`);
  try{
    const res=normalizeAi(await gemini(aiRoutinePrompt(),{json:true,signal:c.ctl.signal}));
    if(sheetCtx!==c)return;c.result=res;c.step="preview";aiPreview();
  }catch(e){
    if(sheetCtx!==c)return;
    if(e.code==="cancelled"){aiSheetSet(aiFormHtml());return}
    aiSheetSet(aiFormHtml());toast(aiErrMsg(e.code));
  }
}
function aiPreview(){
  const r=sheetCtx.result;
  aiSheetSet(`<h2>Sua rotina</h2>${r.resumo?`<p style="margin:0">${esc(r.resumo)}</p>`:""}
    ${r.fichas.map((f,i)=>`<section class="rcard" style="--plate:var(--p-${PLATES[i%PLATES.length].k})">
      <div class="rhead"><span class="plate"></span><div class="grow"><h3>${esc(f.nome)}</h3></div><div class="days">${DIAS.map((d,j)=>`<span class="${f.dias.includes(j)?"on":""}">${d}</span>`).join("")}</div></div>
      ${f.exercicios.map(e=>`<div class="exrow">${libThumb(e.lib.id)}<span class="grow"><span class="t">${esc(e.lib.n)}</span><br><span class="s num">${e.series}x ${esc(e.reps)} · descanso ${e.rest}s</span>${e.obs?`<br><span class="s">${esc(e.obs)}</span>`:""}</span></div>`).join("")}
    </section>`).join("")}
    ${r.dicas.length?`<div class="card"><b>Dicas</b><ul class="aitips">${r.dicas.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:""}
    <button class="btn primary big block" data-act="aiSave" data-mode="add">Salvar como novas fichas</button>
    ${S.routines.length?`<button class="btn danger block" data-act="aiSave" data-mode="replace">Substituir minhas fichas atuais</button>`:""}
    <div class="row"><button class="btn grow" data-act="aiGenerate">Gerar outra versão</button><button class="btn grow" data-act="aiBack">Ajustar respostas</button></div>
    <p class="ainote">Rotina gerada por IA. Ajuste as cargas na primeira semana e procure um profissional se tiver lesões.</p>`);
}
function lastLoadForLib(libId){
  const ids=S.routines.flatMap(r=>(r.exercises||[]).filter(e=>e.libId===libId).map(e=>e.id));let best=null,bd="";
  ids.forEach(id=>{const h=exHistory(id);const l=h[h.length-1];if(l&&l.date>bd){bd=l.date;best=l.max}});return best;
}
async function aiSave(btn){
  const r=sheetCtx&&sheetCtx.result;if(!r)return;
  const replace=btn.dataset.mode==="replace";
  if(replace&&!armed(btn))return;
  btn.disabled=true;
  const ok=await dbWrite(async()=>{
    if(replace)for(const old of S.routines)await db.collection("routines").doc(old.id).delete();
    const base=replace?0:S.routines.reduce((m,x)=>Math.max(m,x.order||0),0);
    for(let i=0;i<r.fichas.length;i++){const f=r.fichas[i];
      await db.collection("routines").doc(uid()).set({name:f.nome,order:base+i+1,days:f.dias,color:PLATES[i%PLATES.length].k,exemplo:false,ia:true,
        exercises:f.exercicios.map(e=>({id:uid(),name:e.lib.n,group:e.lib.g,sets:String(e.series),reps:e.reps,load:lastLoadForLib(e.lib.id),rest:e.rest,note:e.obs,mediaId:null,mediaType:null,libId:e.lib.id}))});
    }
  },replace?"Fichas substituídas":"Fichas criadas");
  if(ok){closeSheet();S.tab="fichas";LS.set("treino-tab","fichas");render();window.scrollTo(0,0)}else btn.disabled=false;
}

/* ---------- IA: análise da evolução ---------- */
function fmtWhen(ts){const d=new Date(ts);return`${pad(d.getDate())}/${pad(d.getMonth()+1)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function aiCard(){
  const run=S.aiRun,saved=S.aiAnalysis;
  const body=run?`<div class="md" id="aiout">${run.text?md(run.text):'<p class="muted"><span class="spin sm" aria-hidden="true"></span> O Gemini está analisando seus treinos…</p>'}</div>`
    :saved?`<div class="md">${md(saved.text)}</div>`:`<p class="muted" style="margin:0">Receba um diagnóstico da sua evolução, com pontos de atenção e sugestão de carga para o próximo treino.</p>`;
  const btn=run?`<button class="btn sm" data-act="aiStop">Parar</button>`
    :aiReady()?`<button class="btn sm primary" data-act="aiAnalyze">${SPARK} ${saved?"Gerar nova análise":"Analisar minha evolução"}</button>`
    :IS_ADMIN?`<button class="btn sm" data-act="aiConfig">Configurar IA</button>`:`<span class="muted" style="font-size:13px">A IA ainda não foi configurada pelo administrador.</span>`;
  return`<section class="aicard"><div class="row"><span class="aibadge">${SPARK} IA</span><h3 class="grow">Análise da evolução</h3>${saved&&!run?`<span class="muted" style="font-size:12px">${fmtWhen(saved.at)}</span>`:""}</div>${body}<div class="row">${btn}</div><p class="ainote">Orientação geral gerada por IA. Não substitui um profissional de educação física.</p></section>`;
}
function analysisPrompt(){
  const L=[];L.push(`Data de hoje: ${today()}`);if(ME&&ME.nome)L.push(`Aluno: ${ME.nome}`);
  L.push("\nFICHAS ATUAIS:");
  if(!S.routines.length)L.push("- nenhuma");
  S.routines.forEach(r=>L.push(`- ${r.name} (dias: ${daysText(r.days)}): `+(r.exercises||[]).map(e=>`${e.name} ${e.sets||"?"}x${e.reps||"?"}${e.load!=null&&e.load!==""?" "+e.load+"kg":""}`).join("; ")));
  const wk=[];for(let i=7;i>=0;i--){const ws=weekStart(new Date());ws.setDate(ws.getDate()-7*i);const we=new Date(ws);we.setDate(ws.getDate()+7);
    wk.push(`${pad(ws.getDate())}/${pad(ws.getMonth()+1)}: ${S.sessions.filter(s=>{const d=pYmd(s.date);return d>=ws&&d<we}).length}`)}
  L.push("\nTREINOS POR SEMANA (últimas 8; início da semana: quantidade): "+wk.join(" | "));
  L.push(`Total de treinos registrados: ${S.sessions.length}`);
  L.push("\nHISTÓRICO POR EXERCÍCIO (data: carga máxima kg x repetições, número de séries), do mais antigo ao mais recente:");
  let any=false;
  allExercises().forEach(e=>{const h=exHistory(e.id).slice(-12);if(!h.length)return;any=true;
    L.push(`- ${e.name}: `+h.map(x=>{const d=pYmd(x.date);const top=x.sets.reduce((a,b)=>(num(b.w)||0)>=(num(a.w)||0)?b:a);return`${pad(d.getDate())}/${pad(d.getMonth()+1)}: ${fmt(x.max)}kg x ${top.r} (${x.sets.length} séries)`}).join("; "))});
  if(!any)L.push("- ainda sem treinos registrados");
  if(S.measures.length){L.push("\nMEDIDAS CORPORAIS (mais recente primeiro):");S.measures.slice(0,10).forEach(m=>L.push(`- ${m.date}: `+MEDIDAS.filter(k=>m[k.k]!=null&&m[k.k]!=="").map(k=>`${k.n} ${m[k.k]} ${k.u}`).join(", ")))}
  return`Você é um personal trainer experiente analisando o diário de treino de um aluno de academia.
Escreva em português do Brasil, de forma direta e motivadora, em Markdown simples: use apenas "## " para títulos, "- " para listas e **negrito**. No máximo 350 palavras.
Use exatamente estas seções:
## Resumo
## O que está indo bem
## Pontos de atenção
## Próximos passos
Em "Próximos passos", sugira a carga do próximo treino para os principais exercícios, com progressão segura (em geral +2 a 5% quando o aluno completou todas as repetições; manter ou reduzir quando estagnou). Comente a frequência semanal e, se houver medidas, a tendência delas.
Use somente os dados abaixo e não invente números. Se houver poucos dados, diga isso e dê orientações para as primeiras semanas.

DADOS
${L.join("\n")}`;
}
async function runAnalysis(){
  if(S.aiRun)return;
  const ctl=new AbortController();S.aiRun={text:"",ctl};render();
  try{
    const{text}=await gemini(analysisPrompt(),{signal:ctl.signal,onText:({text})=>{if(!S.aiRun)return;S.aiRun.text=text;const o=$("#aiout");if(o)o.innerHTML=md(text)}});
    S.aiRun=null;const at=Date.now();S.aiAnalysis={text,at};render();
    db&&withTimeout(db.doc("ai/analise").set({text,at}));
  }catch(e){
    const partial=(S.aiRun&&S.aiRun.text)||e.text||"";S.aiRun=null;
    if(e.code==="cancelled"){if(partial)S.aiAnalysis={text:partial+"\n\n_(análise interrompida)_",at:Date.now()};render();return}
    render();toast(aiErrMsg(e.code));
  }
}

render();
startFirebase();
})();
